name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: codeql-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          # The library-input queries start from the package entry point (main: dist/jquery.form.js),
          # so keep that build; skip its duplicates. Tests and the docs site are not shipped.
          config: |
            paths-ignore:
              - dist/jquery.form.mjs
              - dist/jquery.form.min.js
              - dist/*.map
              - test
              - docs
              - node_modules
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

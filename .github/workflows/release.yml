name: Release

# Publishes a v* tag to npm through trusted publishing (OIDC, with provenance). The publish job runs
# in the `npm` environment, which needs a maintainer's approval and accepts only v* tags; npm accepts
# OIDC tokens only from this workflow file in that environment. Run it by hand to rehearse `verify`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      dist-tag: ${{ steps.dist-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Get Playwright version
        id: playwright
        # The runner image is in the key: a browser cached on one Ubuntu release can miss libraries on the next.
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}
      # npm test runs the suite in Chromium and WebKit; WebKit needs its system libraries.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - name: Check committed dist matches the build
        run: git diff --exit-code -- dist
      - name: Check the tag matches an unpublished package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$version."
            exit 1
          fi
          if [ -n "$(npm view "jquery-form@$version" version 2>/dev/null)" ]; then
            echo "jquery-form@$version is already on npm."
            exit 1
          fi
      # A pre-release goes to `next`, an older major (a 4.x fix after 5.0) to `v<major>`, and
      # anything else to `latest`. A stable version below `latest` in the same major is refused,
      # so `latest` never moves back.
      - name: Choose the npm dist-tag
        id: dist-tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          latest=$(npm view jquery-form@latest version 2>/dev/null || true)
          tag=$(VERSION="$version" LATEST="$latest" node -e '
            const parse = (v) => v.split("-")[0].split(".").map(Number);
            const { VERSION: version, LATEST: latest } = process.env;
            if (version.includes("-")) { console.log("next"); process.exit(0); }
            if (!latest) { console.log("latest"); process.exit(0); }
            const [a, b] = [parse(version), parse(latest)];
            if (a[0] < b[0]) { console.log("v" + a[0]); process.exit(0); }
            const lower = a[0] === b[0] && (a[1] < b[1] || (a[1] === b[1] && a[2] < b[2]));
            console.log(lower ? "" : "latest");
          ')
          if [ -z "$tag" ]; then
            echo "$version is below latest ($latest) in the same major; publish it from a branch with its own dist-tag."
            exit 1
          fi
          echo "jquery-form@$version will be published with the dist-tag $tag (latest is ${latest:-none})."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # npm pack lists the same files as npm publish without asking the registry, so a rehearsal from
      # a branch passes even though its version is already published.
      - name: Show the tarball that would be published
        run: npm pack --dry-run

  publish:
    needs: verify
    env:
      DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # No npm ci: no dependency code runs in the job that can publish. dist/ is committed, and the
      # verify job has checked it against a fresh build.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Publish with the dist-tag the verify job chose
        run: |
          if [ -z "$DIST_TAG" ]; then
            echo "The verify job chose no dist-tag."
            exit 1
          fi
          npm publish --tag "$DIST_TAG"

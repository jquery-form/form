name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  # No paths-ignore on pull requests: a skipped workflow never reports the required checks, which
  # blocks the merge. The `changes` job skips the slow steps instead when only docs changed.
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # code is "false" for a pull request that only changes docs/ or Markdown files.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Check for changes outside docs
        id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^1 HEAD | grep -qvE '^docs/|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs changed: lint and format:check run, the build and suites are skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    runs-on: ubuntu-latest
    env:
      CODE: ${{ needs.changes.outputs.code }}
    steps:
      - name: Set timings file path
        run: echo "TIMINGS=$RUNNER_TEMP/timings.tsv" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: npm ci
        run: |
          start=$(date +%s)
          trap 'printf "%s\t%s\n" "npm ci" "$(($(date +%s) - start))" >> "$TIMINGS"' EXIT
          npm ci
      - name: Get Playwright version
        id: playwright
        if: env.CODE == 'true'
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        if: env.CODE == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and WebKit
        if: env.CODE == 'true'
        run: |
          start=$(date +%s)
          trap 'printf "%s\t%s\n" "Install Chromium and WebKit" "$(($(date +%s) - start))" >> "$TIMINGS"' EXIT
          npx playwright install --with-deps chromium webkit
      - name: Check the test script matches the CI steps
        run: |
          expected="npm run lint && npm run format:check && npm run build && vitest run --coverage --project !suite-webkit && vitest run --project suite-webkit"
          actual=$(node -p "require('./package.json').scripts.test")
          if [ "$actual" != "$expected" ]; then
            echo "package.json test script has drifted from the CI steps."
            echo "expected: $expected"
            echo "actual:   $actual"
            exit 1
          fi
      - name: npm run lint
        run: |
          start=$(date +%s)
          trap 'printf "%s\t%s\n" "npm run lint" "$(($(date +%s) - start))" >> "$TIMINGS"' EXIT
          npm run lint
      - name: npm run format:check
        run: |
          start=$(date +%s)
          trap 'printf "%s\t%s\n" "npm run format:check" "$(($(date +%s) - start))" >> "$TIMINGS"' EXIT
          npm run format:check
      - name: npm run build
        if: env.CODE == 'true'
        run: |
          start=$(date +%s)
          trap 'printf "%s\t%s\n" "npm run build" "$(($(date +%s) - start))" >> "$TIMINGS"' EXIT
          npm run build
      - name: vitest run --coverage
        if: env.CODE == 'true'
        run: |
          start=$(date +%s)
          trap 'printf "%s\t%s\n" "vitest run --coverage" "$(($(date +%s) - start))" >> "$TIMINGS"' EXIT
          npx vitest run --coverage --project !suite-webkit --reporter=default --reporter=json --outputFile.json=vitest-report.json
      - name: vitest run --project suite-webkit
        if: env.CODE == 'true'
        run: |
          start=$(date +%s)
          trap 'printf "%s\t%s\n" "vitest run --project suite-webkit" "$(($(date +%s) - start))" >> "$TIMINGS"' EXIT
          npx vitest run --project suite-webkit
      - name: Check committed dist matches the build
        if: env.CODE == 'true'
        run: |
          start=$(date +%s)
          trap 'printf "%s\t%s\n" "Check committed dist matches the build" "$(($(date +%s) - start))" >> "$TIMINGS"' EXIT
          git diff --exit-code -- dist
      - name: Upload Vitest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-report
          path: vitest-report.json
          if-no-files-found: ignore
      - name: Write step durations to the summary
        if: always()
        run: |
          {
            echo "| Step | Seconds |"
            echo "| --- | ---: |"
            awk -F '\t' '{ printf "| %s | %s |\n", $1, $2 }' "$TIMINGS"
          } >> "$GITHUB_STEP_SUMMARY"

  # The suite against the jQuery support floor, the latest 3.x, and 4.x.
  # Branch protection requires each matrix check by name, so a docs-only PR skips the steps, not the
  # job: a job skipped by `if` reports one unexpanded "jQuery ${{ matrix.jquery }}" check instead.
  jquery:
    name: jQuery ${{ matrix.jquery }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { jquery: "1.7.2", file: ".jquery/jquery-1.7.2.js" }
          - { jquery: "3.7.1", file: "node_modules/jquery/dist/jquery.js" }
          - { jquery: "4.0.0", file: "node_modules/jquery4/dist/jquery.js" }
    env:
      CODE: ${{ needs.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        if: env.CODE == 'true'
      - uses: actions/setup-node@v7
        if: env.CODE == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: env.CODE == 'true'
      - name: Get Playwright version
        id: playwright
        if: env.CODE == 'true'
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        if: env.CODE == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install chromium
        if: env.CODE == 'true'
      - name: Fetch jQuery 1.7.2
        if: env.CODE == 'true' && matrix.jquery == '1.7.2'
        run: scripts/fetch-jquery.sh 1.7.2
      - name: Run the suite on jQuery ${{ matrix.jquery }}
        if: env.CODE == 'true'
        run: npx vitest run --project suite
        env:
          JQUERY_FILE: ${{ matrix.file }}
